# meson cross file: Mesa for the Xbox 360's Debian ppc64 (big-endian, ELFv1), sysroot = the NFS root
[binaries]
c = 'powerpc64-linux-gnu-gcc'
cpp = 'powerpc64-linux-gnu-g++'
ar = 'powerpc64-linux-gnu-ar'
strip = 'powerpc64-linux-gnu-strip'
pkg-config = 'pkg-config'

[properties]
sys_root = '/srv/nfs/xenon'
pkg_config_libdir = '/srv/nfs/xenon/usr/lib/powerpc64-linux-gnu/pkgconfig:/srv/nfs/xenon/usr/share/pkgconfig'

[built-in options]
c_args = ['--sysroot=/srv/nfs/xenon', '-mcpu=970', '-mtune=cell', '-mno-altivec']
cpp_args = ['--sysroot=/srv/nfs/xenon', '-mcpu=970', '-mtune=cell', '-mno-altivec']
c_link_args = ['--sysroot=/srv/nfs/xenon']
cpp_link_args = ['--sysroot=/srv/nfs/xenon']

[host_machine]
system = 'linux'
cpu_family = 'ppc64'
cpu = 'ppc64'
endian = 'big'
