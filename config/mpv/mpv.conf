# Xbox 360 (Xenos): GLES 2.0 on the GPU (desktop GL is 2.0, mpv needs 2.1),
# no hardware decode, ALSA (snd-xenon, 48 kHz stereo, HDMI)
vo=gpu
gpu-api=opengl
gpu-context=x11egl
opengl-es=yes
hwdec=no
ao=alsa
audio-samplerate=48000
audio-channels=stereo
profile=fast
# H.264 decodes ~2x real time at 720p on the CPU; VP9/AV1 cost far more
ytdl-format=bestvideo[vcodec^=avc1][height<=720][fps<=30]+bestaudio/best[height<=720][fps<=30]
