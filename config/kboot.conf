#KBOOTCONFIG
# Served by insight (10.0.0.199). The copy on the USB stick root is what Xell reads first;
# keep the two in sync (the USB copy is updated over Aurora FTP at Usb0:\kboot.conf).
tftp_server=10.0.0.199
timeout=20
default=debian
speedup=1
linux="vmlinux console=tty0 panic=30 maxcpus=6 coherent_pool=6M video=xenosfb initrd=initrd.gz"
debian="vmlinux root=/dev/nfs nfsroot=10.0.0.199:/srv/nfs/xenon,vers=3,tcp,nolock ip=dhcp rw console=tty0 panic=30 maxcpus=6 coherent_pool=6M video=xenosfb"
debian-old="vmlinux-prealtivec root=/dev/nfs nfsroot=10.0.0.199:/srv/nfs/xenon,vers=3,tcp,nolock ip=dhcp rw console=tty0 panic=30 maxcpus=6 coherent_pool=6M video=xenosfb"
cube="xenon.elf"
hello="elf/hello.elf"
xenu="elf/xenu.elf"
tank360="elf/tank360.elf"
quake="elf/quake.elf"
mupen64="elf/mupen64.elf"
nulldc="elf/nulldc.elf"
snes9xgx="elf/snes9xgx.elf"
xmplayer="elf/xmplayer.elf"
